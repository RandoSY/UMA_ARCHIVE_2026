<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">UMA Archive 2026 Logo</title>
  <desc id="desc">A triadic logo for UMA Archive 2026 representing Measured World, Measured Machine, and Measured Self.</desc>
  <defs>
    <linearGradient id="redGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d71920"/>
      <stop offset="1" stop-color="#8b0f14"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d7fa3"/>
      <stop offset="1" stop-color="#083f63"/>
    </linearGradient>
    <linearGradient id="darkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303946"/>
      <stop offset="1" stop-color="#151a22"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#111827" flood-opacity="0.16"/>
    </filter>
    <style>
      .title { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-weight: 800; letter-spacing: -2px; }
      .tag { font-family: Inter, Segoe UI, Roboto, Helvetica, Arial, sans-serif; font-weight: 500; letter-spacing: 2px; }
      .micro { stroke: #ffffff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .92; }
      .thin { stroke: #ffffff; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; fill: none; opacity: .9; }
      .grid { stroke: #ffffff; stroke-width: 3; fill: none; opacity: .58; }
    </style>
  </defs>

  <rect width="1400" height="900" fill="#f8fafc"/>

  <g filter="url(#shadow)">
    <!-- Three-part emblem -->
    <path d="M700 92 C865 92 1007 187 1076 322 C998 300 913 310 838 357 C789 238 709 164 600 139 C629 108 661 92 700 92 Z" fill="url(#darkGrad)"/>
    <path d="M357 478 C278 333 310 165 434 70 C431 151 467 230 536 291 C434 362 384 467 393 588 C378 557 365 520 357 478 Z" fill="url(#redGrad)"/>
    <path d="M1032 575 C950 715 792 786 633 759 C696 713 744 642 760 553 C886 572 994 540 1082 456 C1079 498 1063 540 1032 575 Z" fill="url(#blueGrad)"/>

    <!-- White separators and inner space -->
    <path d="M507 184 C629 206 726 295 765 420 C650 383 526 412 437 497 C420 371 450 267 507 184 Z" fill="#f8fafc"/>
    <path d="M785 412 C860 343 964 318 1072 344 C1016 451 917 512 792 520 C817 485 813 447 785 412 Z" fill="#f8fafc"/>
    <path d="M436 498 C535 455 653 471 750 548 C643 641 508 647 396 587 C393 554 406 524 436 498 Z" fill="#f8fafc"/>

    <!-- Center UMA -->
    <text x="700" y="444" text-anchor="middle" class="title" font-size="96" fill="#c5161d">UMA</text>

    <!-- Measured World details -->
    <g transform="translate(382 143)">
      <path class="thin" d="M0 300 C58 246 103 246 160 300 C220 237 277 235 338 298"/>
      <path class="grid" d="M6 322 C84 286 173 284 321 321"/>
      <path class="grid" d="M28 355 C115 322 199 321 300 356"/>
      <path class="grid" d="M60 386 C128 360 198 359 266 386"/>
      <path class="grid" d="M68 316 L112 389 M126 296 L150 396 M196 296 L184 396 M258 315 L224 389"/>
      <path class="thin" d="M91 245 L140 184 L176 230 L207 191 L276 270"/>
      <path class="thin" d="M138 184 L150 240 M207 191 L203 261"/>
      <path class="thin" d="M282 70 L282 260 M268 95 L282 95 M258 125 L282 125 M268 155 L282 155 M258 185 L282 185 M268 215 L282 215"/>
      <circle cx="345" cy="120" r="34" stroke="#fff" stroke-width="6" fill="none" opacity=".92"/>
      <path class="thin" d="M345 74 L345 166 M299 120 L391 120"/>
      <g fill="#fff" opacity=".85">
        <circle cx="40" cy="112" r="4"/><circle cx="80" cy="90" r="4"/><circle cx="116" cy="126" r="4"/><circle cx="174" cy="82" r="4"/><circle cx="220" cy="116" r="4"/><circle cx="250" cy="74" r="4"/>
      </g>
    </g>

    <!-- Measured Machine details -->
    <g transform="translate(804 134)">
      <rect x="120" y="224" width="78" height="78" rx="8" stroke="#fff" stroke-width="6" fill="none" opacity=".9"/>
      <path class="micro" d="M159 224 V160 H112"/>
      <path class="micro" d="M198 251 H265 V194"/>
      <path class="micro" d="M120 260 H65 V328"/>
      <path class="micro" d="M198 296 H290"/>
      <path class="micro" d="M122 302 V365"/>
      <path class="micro" d="M80 88 V190 H120"/>
      <path class="micro" d="M245 92 V146 H215 V224"/>
      <path class="micro" d="M310 175 H254"/>
      <circle cx="112" cy="160" r="10" fill="#fff"/><circle cx="265" cy="194" r="10" fill="#fff"/><circle cx="65" cy="328" r="10" fill="#fff"/><circle cx="290" cy="296" r="10" fill="#fff"/><circle cx="80" cy="88" r="10" fill="#fff"/><circle cx="245" cy="92" r="10" fill="#fff"/><circle cx="310" cy="175" r="10" fill="#fff"/>
    </g>

    <!-- Measured Self details -->
    <g transform="translate(515 555)">
      <path d="M207 45 C226 45 240 59 240 76 C240 94 226 108 207 108 C188 108 174 94 174 76 C174 59 188 45 207 45 Z" fill="#fff"/>
      <path d="M182 128 C148 146 118 171 88 204 L116 222 C139 200 160 185 181 176 L150 284 L186 284 L212 203 L253 245 L316 232 L306 203 L264 211 L225 164 C215 147 203 136 182 128 Z" fill="#fff"/>
      <path class="thin" d="M0 140 H100 M20 180 H110 M-12 220 H82" opacity=".7"/>
      <path class="thin" d="M390 83 C436 125 458 174 457 231 M351 105 C389 139 409 179 410 225 M315 127 C347 156 363 189 363 222" stroke="#7fe7ff" opacity=".8"/>
      <path class="thin" d="M305 255 C357 285 410 286 462 254" stroke="#7fe7ff" opacity=".8"/>
      <circle cx="386" cy="197" r="5" fill="#fff" opacity=".9"/><circle cx="414" cy="177" r="5" fill="#fff" opacity=".9"/><circle cx="437" cy="151" r="5" fill="#fff" opacity=".9"/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="700" y="780" text-anchor="middle" class="title" font-size="86">
    <tspan fill="#c5161d">UMA</tspan><tspan fill="#202733"> Archive 2026</tspan>
  </text>

  <g transform="translate(273 835)">
    <line x1="0" y1="0" x2="72" y2="0" stroke="#c5161d" stroke-width="4"/>
    <text x="100" y="9" class="tag" font-size="25" fill="#2b3442">Measured World</text>
    <circle cx="358" cy="0" r="5" fill="#c5161d"/>
    <text x="383" y="9" class="tag" font-size="25" fill="#2b3442">Measured Machine</text>
    <circle cx="703" cy="0" r="5" fill="#0b6f95"/>
    <text x="728" y="9" class="tag" font-size="25" fill="#2b3442">Measured Self</text>
    <line x1="960" y1="0" x2="1032" y2="0" stroke="#0b6f95" stroke-width="4"/>
  </g>
</svg>
